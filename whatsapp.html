<script>
  // لو عايز تحاول تفتح التطبيق على الموبايل أولاً
  document.getElementById('waBtn').addEventListener('click', function(e) {
    // مش هنمنع السلوك الافتراضي، الرابط نفسه كفاية
    // لكن ممكن نحاول نفتح التطبيق مباشرة
    var phone = "966548518022";
    var msg = "السلام عليكم، أريد الاستفسار عن تنظيم رحلات عمرة من الرياض";
    var appUrl = "whatsapp://send?phone=" + phone + "&text=" + encodeURIComponent(msg);
    var webUrl = "https://api.whatsapp.com/send?phone=" + phone + "&text=" + encodeURIComponent(msg);

    // لو موبايل، جرب التطبيق
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      e.preventDefault();
      window.location.href = appUrl;
      setTimeout(function() {
        window.location.href = webUrl;
      }, 1000);
    }
    // لو ديسكتوب، الرابط هيفتح واتساب ويب
  });
</script>
