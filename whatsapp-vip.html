<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عرض VIP | احجز الآن</title>
    <meta name="description" content="ارغب في حجز عرض ال vip - رحلات عمرة VIP من الرياض إلى مكة المكرمة | باصات فاخرة | فنادق 5 نجوم | احجز الآن عبر الواتساب" />
    <link rel="icon" type="image/jpeg" href="images/logo.jpg" />
    <!-- Open Graph للإعلانات -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="عرض VIP" />
    <meta property="og:description" content="احجز عرض الـ VIP الآن - رحلات عمرة فاخرة من الرياض إلى مكة | اضغط للتواصل واتساب" />
    <meta property="og:image" content="images/logo.jpg" />
    <meta name="theme-color" content="#064e3b" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Cairo', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: url('images/vip.jpg') center/cover no-repeat;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(6, 78, 59, 0.88);
      }

      .container {
        position: relative;
        z-index: 1;
        text-align: center;
        color: #fff;
        padding: 40px 20px;
        max-width: 700px;
        width: 100%;
      }

      .logo-img {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        object-fit: cover;
        margin: 0 auto 20px;
        display: block;
        border: 4px solid #d4af37;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        animation: pulse 2s infinite;
        background: #fff;
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
        70% { box-shadow: 0 0 0 22px rgba(37, 211, 102, 0); }
        100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 900;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .highlight {
        color: #d4af37;
      }

      .vip-badge {
        display: inline-block;
        background: linear-gradient(135deg, #d4af37, #f5d76e);
        color: #064e3b;
        font-weight: 900;
        padding: 6px 25px;
        border-radius: 30px;
        margin-bottom: 15px;
        font-size: 1.1rem;
        box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
      }

      .subtitle {
        font-size: 1.25rem;
        opacity: 0.95;
        margin-bottom: 30px;
        line-height: 1.9;
      }

      .features {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-bottom: 35px;
        flex-wrap: wrap;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1rem;
        background: rgba(255,255,255,0.12);
        padding: 8px 18px;
        border-radius: 30px;
        backdrop-filter: blur(5px);
      }

      .feature i {
        color: #d4af37;
        font-size: 1.1rem;
      }

      .whatsapp-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: #25D366;
        color: #fff;
        padding: 19px 55px;
        border-radius: 60px;
        font-size: 1.35rem;
        font-weight: 800;
        text-decoration: none;
        transition: all 0.3s ease;
        font-family: 'Cairo', sans-serif;
        border: none;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(37, 211, 102, 0.45);
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      .whatsapp-btn:hover {
        background: #128C7E;
        transform: scale(1.05);
      }

      .whatsapp-btn i {
        font-size: 1.9rem;
      }

      .auto-redirect {
        margin-top: 25px;
        font-size: 1rem;
        opacity: 0.85;
      }

      .timer {
        color: #d4af37;
        font-weight: 800;
        font-size: 1.2rem;
      }

      .loading {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .loading span {
        width: 12px;
        height: 12px;
        background: #d4af37;
        border-radius: 50%;
        animation: loading 1.4s infinite ease-in-out both;
      }

      .loading span:nth-child(1) { animation-delay: -0.32s; }
      .loading span:nth-child(2) { animation-delay: -0.16s; }

      @keyframes loading {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
      }

      @media (max-width: 480px) {
        h1 { font-size: 1.9rem; }
        .subtitle { font-size: 1.05rem; }
        .whatsapp-btn { padding: 16px 35px; font-size: 1.15rem; }
        .logo-img { width: 110px; height: 110px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- اللوجو من الصور -->
      <img src="images/logo.jpg" alt="عرض VIP" class="logo-img" />

      <div class="vip-badge">عرض خاص للإعلانات ⭐ VIP</div>
      <h1>عرض الـ <span class="highlight">VIP</span></h1>
      <p class="subtitle">
        احجز عرض الـ <strong>VIP</strong> الآن<br>
        باصات فاخرة | فنادق 5 نجوم قريبة من الحرم
      </p>
      <div class="features">
        <div class="feature">
          <i class="fas fa-crown"></i>
          <span>عرض VIP مميز</span>
        </div>
        <div class="feature">
          <i class="fas fa-bus"></i>
          <span>باصات فاخرة</span>
        </div>
        <div class="feature">
          <i class="fas fa-hotel"></i>
          <span>فنادق 5 نجوم</span>
        </div>
      </div>
      <a href="https://wa.me/966535916616?text=%D8%A7%D8%B1%D8%BA%D8%A8%20%D9%81%D9%8A%20%D8%AD%D8%AC%D8%B2%20%D8%B9%D8%B1%D8%B6%20%D8%A7%D9%84%20vip" class="whatsapp-btn" id="whatsappBtn">
        <i class="fab fa-whatsapp"></i>
        احجز عرض VIP الآن
      </a>
      <p class="auto-redirect">جاري تحويلك إلى الواتساب خلال <span class="timer" id="timer">2</span> ...</p>
      <div class="loading">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <script>
      const whatsappUrl = 'https://wa.me/966535916616?text=' + encodeURIComponent('ارغب في حجز عرض ال vip');

      // تحديث الزر لضمان نفس الرابط
      document.getElementById('whatsappBtn').href = whatsappUrl;

      // عدّاد + تحويل تلقائي بعد ثانيتين (علشان البكسل يلحق يسجل زيارة الإعلان)
      let seconds = 2;
      const timerEl = document.getElementById('timer');
      const countdown = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(countdown);
          window.location.href = whatsappUrl;
        } else {
          timerEl.textContent = seconds;
        }
      }, 1000);

      // تحويل فوري احتياطي بعد 2.5 ثانية لو العدّاد وقف لأي سبب
      setTimeout(() => {
        window.location.href = whatsappUrl;
      }, 2500);
    </script>
  </body>
</html>
